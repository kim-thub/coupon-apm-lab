services:
  db:
    image: postgres:16.6
    environment:
      POSTGRES_USER: ${DB_USER:-lab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_development_only}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
  app:
    build: .
    image: coupon-apm-lab:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-postgres}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-lab}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-local_development_only}
      SPRING_PROFILES_ACTIVE: ${APP_PROFILE:-benchmark}
      APM_ENABLED: ${APM_ENABLED:-true}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m -XX:+UseG1GC"
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    cpus: 2.0
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "java -version >/dev/null 2>&1"]
      interval: 10s
      retries: 10
volumes:
  postgres-data:
